[package]
name = "azmath-linalg"
description = "Lineare Algebra für no_std: Zerlegungen (LU, Cholesky, QR, SVD), iterative Löser, Eigenwerte"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["math", "no_std", "numerics", "embedded"]
categories = ["mathematics", "no-std"]

[features]
default = ["std"]
std = ["azmath-core/std"]
libm = ["azmath-core/libm"]
micromath = ["azmath-core/micromath"]
alloc = ["azmath-core/alloc"]

[dependencies]
azmath-core.workspace = true
