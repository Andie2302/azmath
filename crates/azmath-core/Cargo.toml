[package]
name = "azmath-core"
description = "Real-Trait für f32/f64 mit austauschbarem Backend (std, libm, micromath) für no_std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["math", "no_std", "numerics", "embedded"]
categories = ["mathematics", "no-std"]

[features]
default = ["std"]
std = []
libm = ["dep:libm"]
micromath = ["dep:micromath"]
alloc = []

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }
micromath = { version = "2.1", optional = true, default-features = false }
