[package]
name = "azmath-roots"
description = "Nullstellensuche in einer Veränderlichen (Bisektion, Brent, Newton, Sekante) für no_std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["math", "no_std", "numerics", "embedded"]
categories = ["mathematics", "no-std"]

[features]
default = ["std"]
std = ["azmath-core/std"]
libm = ["azmath-core/libm"]
micromath = ["azmath-core/micromath"]
alloc = ["azmath-core/alloc"]

[dependencies]
azmath-core.workspace = true
