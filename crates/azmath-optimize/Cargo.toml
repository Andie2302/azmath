[package]
name = "azmath-optimize"
description = "Nichtlineare Gleichungssysteme und Ausgleichsrechnung (Newton, Gauß-Newton, Levenberg-Marquardt) für no_std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["math", "no_std", "numerics", "embedded"]
categories = ["mathematics", "no-std"]

[features]
default = ["std"]
std = ["azmath-core/std", "azmath-linalg/std"]
libm = ["azmath-core/libm", "azmath-linalg/libm"]
micromath = ["azmath-core/micromath", "azmath-linalg/micromath"]
alloc = ["azmath-core/alloc", "azmath-linalg/alloc"]

[dependencies]
azmath-core.workspace = true
azmath-linalg.workspace = true
