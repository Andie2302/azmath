[package]
name = "azmath-ode"
description = "Gewöhnliche Differentialgleichungen (RK4, Dormand-Prince, implizites Euler/Trapez) für no_std"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["math", "no_std", "numerics", "embedded"]
categories = ["mathematics", "no-std"]

[features]
default = ["std"]
std = ["azmath-core/std", "azmath-optimize/std"]
libm = ["azmath-core/libm", "azmath-optimize/libm"]
micromath = ["azmath-core/micromath", "azmath-optimize/micromath"]
alloc = ["azmath-core/alloc", "azmath-optimize/alloc"]

[dependencies]
azmath-core.workspace = true
azmath-optimize.workspace = true
