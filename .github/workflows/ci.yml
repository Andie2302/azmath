name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: std,            flags: "" }
          - { name: libm,           flags: "--no-default-features --features libm" }
          - { name: micromath,      flags: "--no-default-features --features micromath" }
          - { name: libm+micromath, flags: "--no-default-features --features libm,micromath" }
          - { name: std+alloc,      flags: "--features alloc" }
          - { name: libm+alloc,     flags: "--no-default-features --features libm,alloc" }
          - { name: micromath+alloc, flags: "--no-default-features --features micromath,alloc" }
          - { name: all features,   flags: "--all-features" }
          - { name: no features,    flags: "--no-default-features" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets ${{ matrix.flags }}
      - run: cargo test ${{ matrix.flags }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build
