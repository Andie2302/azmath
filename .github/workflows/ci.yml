name: CI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # test: true  -> bauen und testen
          # test: false -> nur bauen (micromath ist bewusst ungenau, siehe README)
          - { name: std,             flags: "", test: true }
          - { name: libm,            flags: "--no-default-features --features libm", test: true }
          - { name: micromath,       flags: "--no-default-features --features micromath", test: false }
          - { name: libm+micromath,  flags: "--no-default-features --features libm,micromath", test: true }
          - { name: std+alloc,       flags: "--features alloc", test: true }
          - { name: libm+alloc,      flags: "--no-default-features --features libm,alloc", test: true }
          - { name: micromath+alloc, flags: "--no-default-features --features micromath,alloc", test: false }
          - { name: all features,    flags: "--all-features", test: true }
          - { name: no features,     flags: "--no-default-features", test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets ${{ matrix.flags }}
      - run: cargo test --no-run ${{ matrix.flags }}
        if: ${{ !matrix.test }}
      - run: cargo test ${{ matrix.flags }}
        if: ${{ matrix.test }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build

  micromath-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        features: [micromath, "micromath,alloc"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --features ${{ matrix.features }} --test micromath_smoke

  embedded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [libm, "libm,alloc"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --target thumbv7em-none-eabihf --no-default-features --features ${{ matrix.features }}
