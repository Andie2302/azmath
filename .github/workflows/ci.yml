name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # test: true  -> bauen und testen
          # test: false -> nur bauen (micromath ist bewusst ungenau, siehe README)
          - { name: std,             flags: "", test: true }
          - { name: libm,            flags: "--no-default-features --features libm", test: true }
          - { name: micromath,       flags: "--no-default-features --features micromath", test: false }
          - { name: libm+micromath,  flags: "--no-default-features --features libm,micromath", test: true }
          - { name: std+alloc,       flags: "--features alloc", test: true }
          - { name: libm+alloc,      flags: "--no-default-features --features libm,alloc", test: true }
          - { name: micromath+alloc, flags: "--no-default-features --features micromath,alloc", test: false }
          - { name: all features,    flags: "--all-features", test: true }
          - { name: no features,     flags: "--no-default-features", test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets ${{ matrix.flags }}
      - run: cargo test --workspace ${{ matrix.flags }}
        if: ${{ matrix.test }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --workspace

  # Jedes Crate einzeln und ohne die Features der anderen bauen. Beim Bauen des ganzen Workspace vereinigt Cargo
  # die Features aller Mitglieder; so würde eine fehlende Abhängigkeit eines einzelnen Crates unbemerkt bleiben.
  isolated:
    name: Einzel-Crate (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [azmath-core, azmath-linalg, azmath-roots, azmath-integrate, azmath-interp, azmath-optimize, azmath-ode, azmath-multigrid]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ${{ matrix.crate }} --no-default-features
      - run: cargo build -p ${{ matrix.crate }} --no-default-features --features libm
      - run: cargo build -p ${{ matrix.crate }} --no-default-features --features micromath
      - run: cargo test -p ${{ matrix.crate }} --no-default-features --features libm
      - run: cargo test -p ${{ matrix.crate }}
