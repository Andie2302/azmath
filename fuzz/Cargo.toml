[package]
name = "azmath-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
azmath = { path = "..", features = ["alloc"] }

[[bin]]
name = "special"
path = "fuzz_targets/special.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fft"
path = "fuzz_targets/fft.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sparse"
path = "fuzz_targets/sparse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qp"
path = "fuzz_targets/qp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qp_extreme"
path = "fuzz_targets/qp_extreme.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
