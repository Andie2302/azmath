[package]
name = "azmath"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andie2302/azmath"
readme = "README.md"
description = "Ein generisches Real-Trait für f32 und f64 mit austauschbarem Backend (std, libm, micromath) für no_std"
keywords = ["math", "no_std", "float", "trait", "embedded"]
categories = ["mathematics", "no-std"]

[features]
default = ["std"]
std = []
alloc = []
libm = ["dep:libm"]
micromath = ["dep:micromath"]

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }
micromath = { version = "2.1", optional = true, default-features = false }