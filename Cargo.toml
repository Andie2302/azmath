[package]
name = "azmath"
description = "Ein generisches Real-Trait für f32 und f64 mit austauschbarem Backend (std, libm, micromath) und numerische Verfahren für no_std"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Andie2302/azmath"
readme = "README.md"
exclude = ["design/", "docs/", ".github/", "fuzz/"]
keywords = ["math", "no_std", "float", "numerics", "embedded"]
categories = ["mathematics", "no-std"]

[features]
default = ["std"]
std = []
libm = ["dep:libm"]
micromath = ["dep:micromath"]
alloc = []

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }
micromath = { version = "2.1", optional = true, default-features = false }
